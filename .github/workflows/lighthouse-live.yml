name: Lighthouse (live)

# Audits the deployed site rather than a local directory, so the run sees the
# real _headers — a CSP that broke a script, or a cache rule that stopped
# matching, would show up here and nowhere else.
#
# Cloudflare Pages does not use the GitHub Deployments API, so there is no
# deployment_status to hook into: it reports through a check run named
# "Cloudflare Pages". We poll for that, then audit.

on:
  push:
    branches: [main]

permissions:
  contents: read
  checks: read

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Wait for the Cloudflare Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '.check_runs[] | select(.name == "Cloudflare Pages")
                    | .status + ":" + (.conclusion // "none")' | head -1)
            echo "attempt $i — ${state:-check run not created yet}"
            case "$state" in
              completed:success) echo "deployment done"; exit 0 ;;
              completed:*)       echo "::error::Cloudflare Pages deployment failed ($state)"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::timed out waiting for the Cloudflare Pages check run"
          exit 1

      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://alexiscolin.com/
            https://alexiscolin.com/privacy.html
          configPath: .lighthouserc.live.json
          uploadArtifacts: true
          temporaryPublicStorage: true
